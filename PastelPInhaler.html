<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pastel Pocket Inhaler Machine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(135deg, #b3e5fc, #81d4fa, #4fc3f7);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* Ice falling */
.ice-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(white 2px, transparent 2px),
    radial-gradient(white 1.5px, transparent 2px);
  background-size: 40px 40px, 25px 25px;
  animation: iceFall 15s linear infinite;
  opacity: 0.45;
}

@keyframes iceFall {
  from { background-position: 0 -300px, 60px -500px; }
  to   { background-position: 0 800px, 60px 900px; }
}

/* Machine */
.machine {
  position: relative;
  width: 330px;
  padding: 26px;
  border-radius: 20px;
  background: rgba(255,255,255,0.28);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.35);
  box-shadow: 0 8px 32px rgba(31,38,135,0.35);
  text-align: center;
  z-index: 2;
}

h1 {
  margin-top: 0;
  font-size: 1.2rem;
  color: #033e6b;
}

select, button {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.4);
  background: rgba(255,255,255,0.35);
  font-size: 0.95rem;
}

button {
  font-weight: bold;
  cursor: pointer;
}

.preview {
  height: 90px;
  border-radius: 14px;
  margin: 12px 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: bold;
  background: rgba(0,0,0,0.2);
}

.preview.crack {
  animation: crackFlash 0.45s ease-out;
}

@keyframes crackFlash {
  50% { box-shadow: inset 0 0 28px rgba(255,255,255,0.9); }
}

#message {
  font-size: 0.9rem;
  color: #033e6b;
}
</style>
</head>

<body>

<div class="machine">
  <h1>❄🧊 Pastel Pocket Inhaler 🧊❄</h1>

  <select id="categorySelect">
    <option value="">Select Category</option>
  </select>

  <select id="varietySelect">
    <option value="">Select Variety</option>
  </select>

  <div id="preview" class="preview">Preview</div>

  <button id="purchaseBtn">Purchase</button>
  <p id="message"></p>
</div>

<div class="ice-layer"></div>

<audio id="iceSound" preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_0c8e3e9a39.mp3">
</audio>

<audio id="clickSound" preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/03/10/audio_81c8a7d4b4.mp3">
</audio>

<script>
/* ✅ FIXED OBJECT KEYS */
const inhalers = {
  "Original": {
    "Dark blue": "#0b3c5d",
    "Sky blue": "#87ceeb",
    "Violet": "#b497d6",
    "Yellow": "#f4d03f",
    "Grey": "#7f8c8d",
    "Pink": "#f5b7b1",
	"Black": "#2c3e50",
	"Yellow green": "#d4efdf"
  },
  "Translucent": {
    "Sky blue": "#aed6f1",
    "Yellow green": "#d4efdf",
    "Pink": "#fadbd8",
    "Black": "#2c3e50",
    "White": "#ecf0f1",
    "Purple": "#d2b4de"
  },
  "Fruity series": {
    "Lemongrass 🍋🌱": "#d4efdf",
    "Mango 🥭": "#f39c12",
    "Mixed berries 🍓🫐": "#8e44ad",
    "Orange 🍊": "#e67e22",
    "Vanilla 🍦🧁": "#fdf2e9"
  },
  "Cafe series": {
    "Mint Coffee 🍃☕": "#6f4e37",
    "Mint Cocoa 🍃🍫🫕": "#4e342e",
    "Mint Green tea 🍃🍵": "#7dcea0"
  }
};

const categorySelect = document.getElementById("categorySelect");
const varietySelect = document.getElementById("varietySelect");
const preview = document.getElementById("preview");
const message = document.getElementById("message");
const purchaseBtn = document.getElementById("purchaseBtn");
const iceSound = document.getElementById("iceSound");
const clickSound = document.getElementById("clickSound");

/* Load categories */
for (const category in inhalers) {
  categorySelect.add(new Option(category, category));
}

/* Category change */
categorySelect.addEventListener("change", () => {
  varietySelect.innerHTML = "<option value=''>Select Variety</option>";
  preview.textContent = "Preview";
  preview.style.background = "rgba(0,0,0,0.2)";
  message.textContent = "";

  if (!categorySelect.value) return;

  for (const v in inhalers[categorySelect.value]) {
    varietySelect.add(new Option(v, v));
  }
});

/* Variety change */
varietySelect.addEventListener("change", () => {
  if (!varietySelect.value) return;

  const color = inhalers[categorySelect.value][varietySelect.value];
  preview.style.background = color;
  preview.textContent = varietySelect.value;

  iceSound.currentTime = 0;
  iceSound.play();

  preview.classList.remove("crack");
  void preview.offsetWidth;
  preview.classList.add("crack");
});

/* Purchase */
purchaseBtn.addEventListener("click", () => {
  clickSound.currentTime = 0;
  clickSound.play();

  if (!categorySelect.value || !varietySelect.value) {
    message.textContent = "Please select a category and variety.";
    return;
  }

  message.textContent = `Purchased ${varietySelect.value} (${categorySelect.value}) ❄🧊`;

  setTimeout(() => {
    categorySelect.value = "";
    varietySelect.innerHTML = "<option value=''>Select Variety</option>";
    preview.textContent = "Preview";
    preview.style.background = "rgba(0,0,0,0.2)";
  }, 2000);
});
</script>

</body>
</html>
